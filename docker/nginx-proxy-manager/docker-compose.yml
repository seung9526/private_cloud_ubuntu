version: '3.8'
services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'   # 일반 웹 트래픽 (HTTP)
      - '81:81'   # NPM 관리자 UI 패널
      - '443:443' # 보안 웹 트래픽 (HTTPS)
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true # 이미 존재하는 외부 네트워크를 사용하거나, 없으면 생성하도록 설정
