version: '3.9'

services:

  # ------------------------------------
  # 1. Web Proxy + Load Balancer (Nginx)
  # ------------------------------------
  #nginx:
  #  image: nginx:latest
  #  container_name: nginx
  #  restart: always
  #  ports:
  #    - "80:80"
  #    - "443:443"
  #  volumes:
  #    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #  depends_on:
  #    - flask-api
  #  networks:
  #    - monitoring

  # ------------------------------------
  # 2. Application (Flask API) + Scaling
  # ------------------------------------
  flask-api:
    build: ./app
    container_name: flask-api
    restart: always
    expose:
      - "5000"
    networks:
      - monitoring
    deploy:
      replicas: 2

  # ------------------------------------
  # 3. Docker GUI (Portainer)
  # ------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - monitoring

  # ------------------------------------
  # 4. Monitoring (Prometheus)
  # ------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    networks:
      - monitoring

  # ------------------------------------
  # 5. Visualization (Grafana)
  # ------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # ------------------------------------
  # 6. CI/CD (Jenkins)
  # ------------------------------------
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: always
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring

  # ------------------------------------
  # 7. SonarQube DB (PostgreSQL)
  # ------------------------------------
  postgresql:
    image: postgres:latest
    container_name: sonarqube_db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonarqube_db
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgresql_data:/var/lib/postgresql
    networks:
      - monitoring
    secrets:
      - db_password

  # ------------------------------------
  # 8. Quality Analysis (SonarQube)
  # ------------------------------------
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: always
    ports:
      - "9001:9000"
    volumes:
      - ./sonarqube/conf:/opt/sonarqube/conf
      - ./sonarqube/data:/opt/sonarqube/data
      - ./sonarqube/extensions:/opt/sonarqube/extensions
      - ./sonarqube/logs:/opt/sonarqube/logs
    depends_on:
      - postgresql
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgresql:5432/sonarqube_db
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD_FILE=/run/secrets/db_password
    networks:
      - monitoring
    secrets:
      - db_password

  # ------------------------------------
  # 9. Alertmanager (Prometheus Alerts)
  # ------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - monitoring

# ------------------------------------
# Networks and Volumes
# ------------------------------------
networks:
  monitoring:

volumes:
  portainer_data:
  grafana_data:
  postgresql_data:

# ------------------------------------
# Secrets Definitions
# ------------------------------------
secrets:
  db_password:
    file: /home/test1/secrets/sonar_db_password.txt
