global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['192.168.119.136:9323']

  - job_name: 'flask-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.119.136:8088']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"
